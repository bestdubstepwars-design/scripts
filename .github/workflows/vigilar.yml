name: check

on:
  # Cada ejecución revisa cada 25 min durante ~50 min. El cron solo deja otra en cola
  # (concurrency) para que arranque al terminar la anterior; GitHub lo retrasa mucho.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: vigilar
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      TZ: Europe/Madrid
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: pip install -r requirements.txt
      # Las claves de caché son inmutables: se guarda una por ejecución y se restaura la última.
      - uses: actions/cache@v6
        with:
          path: estado.json
          key: estado-${{ github.run_id }}
          restore-keys: estado-
      - run: python -u imed_alertas.py --minutos 50 --intervalo 25
        env:
          IMED_USUARIO: ${{ secrets.IMED_USUARIO }}
          IMED_PASSWORD: ${{ secrets.IMED_PASSWORD }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
